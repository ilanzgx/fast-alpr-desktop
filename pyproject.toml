[project]
name = "alpr-placas"
version = "0.1.0"
description = "Reconhecimento de placas veiculares offline com PySide6, OpenCV e Redes Neurais ONNX (YOLOv8 + FastPlateOCR)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6>=6.6.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.26.0,<2.0.0",
    "onnxruntime>=1.16.0",
    "fast-plate-ocr>=1.1.0",
]

[project.optional-dependencies]
easyocr = ["easyocr>=1.7.0"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
